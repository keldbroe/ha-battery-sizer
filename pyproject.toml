[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-battery-sizer"
version = "0.5.0"
description = "Home Assistant: recommended home battery size from your own hourly data and Danish electricity prices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "keldbroe" }]
keywords = ["home-assistant", "battery", "solar", "energy", "denmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Home Assistant",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component>=0.13.206",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
